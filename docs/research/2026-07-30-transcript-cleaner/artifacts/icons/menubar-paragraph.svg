<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" role="img" aria-labelledby="t">
  <title id="t">Русификатор — значок строки меню, «Ровный абзац»</title>
  <!-- Template image: только чёрная форма и прозрачность. -->
  <!-- Сетка 18: полосы 2, просветы 3, поля 2 по бокам и 3 сверху и снизу. -->
  <g fill="#000000">
    <!-- Разорванная строка: два сегмента, разрыв 2, правый край не дотягивает -->
    <rect x="2" y="3" width="6" height="2" rx="0.5"/>
    <rect x="10" y="3" width="3.5" height="2" rx="0.5"/>
    <!-- Целая строка: полная мера -->
    <rect x="2" y="8" width="14" height="2" rx="0.5"/>
    <!-- Последняя строка абзаца -->
    <rect x="2" y="13" width="9" height="2" rx="0.5"/>
  </g>
</svg>
