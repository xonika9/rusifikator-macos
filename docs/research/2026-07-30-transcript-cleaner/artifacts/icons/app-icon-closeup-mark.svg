<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">Русификатор — app icon, направление «Знак корректора»</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F3EC"/>
      <stop offset="1" stop-color="#E9E5DA"/>
    </linearGradient>
  </defs>

  <!-- Плита во всё поле. Скругление и свет накладывает система. -->
  <rect width="1024" height="1024" fill="url(#paper)"/>

  <g fill="#1D211F" opacity="0.8">
    <!-- Верхняя строка: полная мера -->
    <rect x="212" y="300" width="600" height="52" rx="14"/>
    <!-- Средняя строка: разорвана чистым пробелом 96 по центру -->
    <rect x="212" y="486" width="252" height="52" rx="14"/>
    <rect x="560" y="486" width="252" height="52" rx="14"/>
    <!-- Нижняя строка: последняя строка абзаца, 65% меры -->
    <rect x="212" y="672" width="390" height="52" rx="14"/>
  </g>

  <!-- Знак «закрыть пробел»: две дуги брюшком к пробелу, шире самого пробела -->
  <g fill="none" stroke="#28715A" stroke-width="32" stroke-linecap="round">
    <path d="M442 409 Q512 449 582 409"/>
    <path d="M442 615 Q512 575 582 615"/>
  </g>
</svg>
